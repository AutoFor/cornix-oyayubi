name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "boards/**"
      - "config/**"
      - "modules/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main