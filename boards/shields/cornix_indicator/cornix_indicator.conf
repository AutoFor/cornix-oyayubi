## use ws2812-spi
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2

CONFIG_RGBLED_WIDGET_BRIGHTNESS=64

CONFIG_RGBLED_WIDGET_LED_SHARING=y

# --- Cornix公式マニュアル準拠の表示設定 (2026-07-08) ---
# 公式: 左ライト=Bluetooth / 右ライト=バッテリー
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=0
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=1
# 公式: 電池表示は「残量少=赤点滅」のみ (高・中残量では光らせない=黒)
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_HIGH=0
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_MEDIUM=0
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_LOW=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CRITICAL=1
